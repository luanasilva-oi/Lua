<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luana Oficial - Redirecionando...</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
height:100vh;
background-color: #ff69b4; /* Fundo rosa da imagem */
display: flex;
align-items: center;
justify-content:center;
overflow:hidden;
user-select:none;
}

/* CARTÃO CENTRAL */
.card {
background: #ffffff;
width: 90%;
max-width: 420px;
padding: 40px 30px;
border-radius: 24px;
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
opacity: 0;
animation: fadeIn 1.2s ease forwards;
}

/* FADE LOAD */
@keyframes fadeIn{
to{
opacity:1;
}
}

/* FOTO DE PERFIL */
.profile-container {
width: 100px;
height: 100px;
border-radius: 50%;
overflow: hidden;
border: 3px solid #eee;
margin-bottom: 20px;
box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.profile-container img {
width: 100%;
height: 100%;
object-fit: cover;
}

/* NOME */
h1 {
color: #111;
font-size: 1.8rem;
margin-bottom: 12px;
font-weight: 700;
}

/* STATUS / VERIFICADO */
.status-info {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
font-size: 0.95rem;
margin-bottom: 8px;
flex-wrap: wrap;
}

.verified {
color: #0095f6;
font-weight: 600;
display: flex;
align-items: center;
gap: 4px;
}

.online {
color: #28a745;
font-weight: 600;
display: flex;
align-items: center;
gap: 4px;
}

.online::before {
content: "";
display: inline-block;
width: 8px;
height: 8px;
background-color: #28a745;
border-radius: 50%;
}

/* TEMPO DE RESPOSTA */
.response-time {
color: #888;
font-size: 0.88rem;
margin-bottom: 25px;
}

/* TIMER */
.timer{
font-size: 0.95rem;
color: #666;
margin-bottom: 20px;
}

.timer span {
font-weight: bold;
color: #ff1493;
}

/* BOTAO */
.telegram-btn{
display:flex;
align-items:center;
justify-content: center;
gap:10px;
background:#ff1493; /* Tom de rosa do botão da imagem */
color:white;
text-decoration:none;
padding:16px 24px;
width: 100%;
border-radius:16px;
font-size:1.15rem;
font-weight:bold;
transition:0.25s;
box-shadow:0 8px 20px rgba(255, 20, 147, 0.35);
}

/* HOVER */
.telegram-btn:hover{
transform:scale(1.02);
background:#e00b82;
}

/* ICON */
.telegram-icon{
width:24px;
height:24px;
fill:white;
}

</style>
</head>

<body>

<div class="card">

<!-- FOTO DE PERFIL (Altere o caminho 'assets/perfil.jpg' para o local da sua foto) -->
<div class="profile-container">
<img src="assets/perfil.jpg" alt="Luana Oficial">
</div>

<h1>Luana Oficial</h1>

<div class="status-info">
<span class="verified">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#0095f6"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
Verificado
</span>
<span class="online">Online</span>
</div>

<div class="response-time">
Tempo médio de resposta: 3 minutos
</div>

<div class="timer">
Redirecionando em <span id="timer">5</span> segundos
</div>

<a href="https://t.me/Luana_Oficial_bot?start=tiktok" 
id="redirect-link"
class="telegram-btn"
target="_blank"
rel="noopener noreferrer">

<svg class="telegram-icon" viewBox="0 0 24 24">
<path d="M12 0C5.373 0 0 5.373 0 12s5.373 
12 12 12 12-5.373 12-12S18.627 
0 12 0zm5.562 8.161l-1.97 
9.274c-.145.658-.537.818-1.084.508l-3-2.211-1.447 
1.394c-.16.16-.295.295-.605.295l.213-3.053 
5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 
4.326-2.962-.924c-.643-.203-.657-.643.136-.953l11.57-4.458c.538-.196 
1.006.128.832.941z"/>
</svg>

Toque aqui pra ter Acesso!

</a>

</div>

<script>

/* BLOQUEAR MENU */
document.addEventListener("contextmenu",e=>e.preventDefault())

document.addEventListener("keydown",function(e){
if(
(e.ctrlKey && ["s","u","i","j"].includes(e.key.toLowerCase()))
|| e.key === "F12"
){
e.preventDefault()
}
})

/* REDIRECIONAMENTO */
let seconds = 5
const timer = document.getElementById("timer")
const link = document.getElementById("redirect-link").href

const countdown = setInterval(()=>{
seconds--
timer.textContent = seconds

if(seconds <= 0){
clearInterval(countdown)
window.location.href = link
}
},1000)

</script>

</body>
</html>
